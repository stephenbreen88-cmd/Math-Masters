<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Masters</title>

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: #dff3ff;
  text-align: center;
  margin: 0;
  padding: 20px;
  color: #173653;
}

.card {
  background: white;
  max-width: 650px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 5px 20px #9bb8c8;
}

h1 {
  color: #1769aa;
  font-size: 42px;
}

h2 {
  color: #1769aa;
}

button {
  background: #2379c5;
  color: white;
  border: 0;
  border-radius: 12px;
  padding: 16px 24px;
  margin: 8px;
  font-size: 20px;
  cursor: pointer;
}

button:hover {
  background: #15558e;
}

input {
  padding: 15px;
  font-size: 22px;
  border: 2px solid #8bb9dd;
  border-radius: 10px;
  max-width: 100%;
  width: 300px;
}

.hidden {
  display: none;
}

.stop {
  background: #b83b3b;
}

.fact {
  min-width: 65px;
}

#question {
  font-size: 48px;
  margin: 25px;
}

#timer {
  font-size: 26px;
  font-weight: bold;
}

#certificate {
  border: 8px double #d4a62d;
  padding: 25px;
  margin-top: 20px;
  background: #fffdf0;
}

@media print {
  body {
    background: white;
  }

  .card {
    box-shadow: none;
  }

  button, .noPrint {
    display: none !important;
  }

  #certificate {
    display: block !important;
  }
}
</style>
</head>

<body>

<div class="card">

<h1>🏆 Math Masters 🏆</h1>

<section id="setup1">
  <h2>Welcome!</h2>
  <p>Enter your first name.</p>

  <input id="studentName"
         placeholder="First name"
         maxlength="30">

  <h2>Choose Your Challenge</h2>

  <button onclick="chooseMode('multiply')">
    Multiplication
  </button>

  <button onclick="chooseMode('divide')">
    Division
  </button>

  <button onclick="chooseMode('both')">
    Both
  </button>
</section>

<section id="setup2" class="hidden">

  <h2>Choose Your Math Facts</h2>

  <p id="modeLabel"></p>

  <div id="factButtons"></div>

  <button onclick="chooseFact('mixed')">
    Mixed Facts (1–12)
  </button>

  <br>

  <button onclick="showPage('setup1')">
    Back
  </button>

</section>

<section id="game" class="hidden">

  <h2 id="gameTitle"></h2>

  <p id="timer">Time: 1:00</p>

  <p id="progress"></p>

  <div id="question"></div>

  <input id="answer"
         type="number"
         inputmode="numeric"
         autocomplete="off"
         placeholder="Your answer">

  <br>

  <button onclick="submitAnswer()">
    Submit
  </button>

  <button class="stop" onclick="stopGame()">
    Stop Game
  </button>

</section>

<section id="results" class="hidden">

  <h2>Challenge Results</h2>

  <div id="resultDetails"></div>

  <h2 id="message"></h2>

  <div id="review"></div>

  <div id="certificate" class="hidden">

    <h1>🏆 Math Masters 🏆</h1>

    <h2>Certificate of Achievement</h2>

    <p>This certificate is proudly awarded to</p>

    <h1 id="certName"></h1>

    <p>For achieving Math Masters status!</p>

    <h2 id="certScore"></h2>

    <p id="certTime"></p>

  </div>

  <br>

  <button id="printButton"
          class="hidden"
          onclick="window.print()">
    Print Certificate
  </button>

  <button onclick="restart()">
    Play Again
  </button>

</section>

</div>

<script>

let name = "";
let mode = "";
let fact = "";

let questions = [];
let index = 0;
let correct = 0;

let mistakes = [];

let seconds = 0;
let remaining = 0;

let timerId = null;
let finished = false;

function showPage(id) {

  document.querySelectorAll("section").forEach(s => {
    s.classList.add("hidden");
  });

  document.getElementById(id).classList.remove("hidden");

}

function chooseMode(m) {

  name = document.getElementById("studentName").value.trim();

  if (!name) {
    alert("Please enter your first name.");
    return;
  }

  mode = m;

  document.getElementById("modeLabel").textContent =
    m === "multiply" ? "Multiplication" :
    m === "divide" ? "Division" :
    "Multiplication and Division";

  let box = document.getElementById("factButtons");

  box.innerHTML = "";

  for (let i = 1; i <= 12; i++) {

    let b = document.createElement("button");

    b.className = "fact";
    b.textContent = i;

    b.onclick = () => chooseFact(i);

    box.appendChild(b);

  }

  showPage("setup2");

}

function random(min, max) {

  return Math.floor(Math.random() * (max - min + 1)) + min;

}

function makeQuestion() {

  let operation = mode === "both"
    ? (random(0, 1) === 0 ? "multiply" : "divide")
    : mode;

  let a, b;

  if (fact === "mixed") {

    a = random(2, 12);
    b = random(2, 12);

    // Include some zero and one facts,
    // but not too many.

    if (random(1, 12) === 1) {
      a = random(0, 1);
    }

    if (random(1, 12) === 1) {
      b = random(0, 1);
    }

  } else {

    a = Number(fact);
    b = random(0, 12);

  }

  if (operation === "multiply") {

    return {
      text: `${a} × ${b} = ?`,
      answer: a * b
    };

  }

  // Division cannot use zero as a divisor.
  if (a === 0) {
    a = 1;
  }

  return {
    text: `${a * b} ÷ ${a} = ?`,
    answer: b
  };

}

function startGame() {

  questions = [];
  index = 0;
  correct = 0;
  mistakes = [];
  finished = false;

  let total = fact === "mixed" ? 100 : 20;

  seconds = fact === "mixed" ? 300 : 60;

  remaining = seconds;

  for (let i = 0; i < total; i++) {
    questions.push(makeQuestion());
  }

  document.getElementById("gameTitle").textContent =
    `${name}'s Math Challenge`;

  showPage("game");

  showQuestion();

  updateTimer();

  clearInterval(timerId);

  timerId = setInterval(() => {

    remaining--;

    updateTimer();

    if (remaining <= 0) {
      finishGame(false);
    }

  }, 1000);

}

function chooseFact(f) {

  fact = f;

  startGame();

}

function updateTimer() {

  let minutes = Math.floor(remaining / 60);

  let secs = remaining % 60;

  document.getElementById("timer").textContent =
    `Time: ${minutes}:${String(secs).padStart(2, "0")}`;

}

function showQuestion() {

  if (index >= questions.length) {
    finishGame(false);
    return;
  }

  document.getElementById("progress").textContent =
    `Question ${index + 1} of ${questions.length}`;

  document.getElementById("question").textContent =
    questions[index].text;

  let input = document.getElementById("answer");

  input.value = "";

  input.focus();

}

function submitAnswer() {

  if (finished) return;

  let input = document.getElementById("answer");

  if (input.value.trim() === "") return;

  let response = Number(input.value);

  let q = questions[index];

  if (response === q.answer) {

    correct++;

  } else {

    mistakes.push({
      question: q.text,
      student: response,
      answer: q.answer
    });

  }

  index++;

  if (index >= questions.length) {

    finishGame(false);

  } else {

    showQuestion();

  }

}

document.getElementById("answer").addEventListener(
  "keydown",
  e => {

    if (e.key === "Enter") {
      submitAnswer();
    }

  }
);

function stopGame() {

  if (confirm("Are you sure you want to stop?")) {
    finishGame(true);
  }

}

function finishGame(stopped) {

  if (finished) return;

  finished = true;

  clearInterval(timerId);

  let total = questions.length;

  let percent = Math.round(correct / total * 100);

  let elapsed = seconds - remaining;

  let minutes = Math.floor(elapsed / 60);

  let secs = elapsed % 60;

  let timeText =
    `${minutes} minute(s) and ${secs} second(s)`;

  showPage("results");

  const details = document.getElementById("resultDetails");

  details.replaceChildren();

  [
    `Student: ${name}`,
    `Score: ${correct} out of ${total}`,
    `Percentage: ${percent}%`,
    `Time: ${timeText}`,
    ...(stopped ? ["Game stopped early."] : [])
  ].forEach(line => {

    let p = document.createElement("p");
    p.textContent = line;
    details.appendChild(p);

  });

  let message = "";

  let earned =
    !stopped &&
    index === total &&
    percent >= 95;

  if (earned) {

    message = "Congratulations! You're a Math Master!";

  } else if (percent >= 80) {

    message = "Great job! Keep up the good work!";

  } else {

    message = "Practice makes progress! Keep trying!";

  }

  document.getElementById("message").textContent = message;

  let review = document.getElementById("review");

  review.replaceChildren();

  let heading = document.createElement("h3");
  heading.textContent = "Incorrect Answers";
  review.appendChild(heading);

  if (mistakes.length === 0) {

    let p = document.createElement("p");
    p.textContent = "No incorrect answers!";
    review.appendChild(p);

  } else {

    mistakes.forEach(m => {

      let p = document.createElement("p");

      p.textContent =
        `${m.question} Your answer: ${m.student}. ` +
        `Correct answer: ${m.answer}.`;

      review.appendChild(p);

    });

  }

  document.getElementById("certificate").classList.toggle(
    "hidden",
    !earned
  );

  document.getElementById("printButton").classList.toggle(
    "hidden",
    !earned
  );

  if (earned) {

    document.getElementById("certName").textContent = name;

    document.getElementById("certScore").textContent =
      `${correct}/${total} — ${percent}%`;

    document.getElementById("certTime").textContent =
      `Completed in ${timeText}`;

  }

}

function restart() {

  clearInterval(timerId);

  showPage("setup1");

}

</script>

</body>
</html>
